<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Fraktions-Management</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="app">
      <h1>Fraktionen</h1>
      <div id="faction-list"></div>
      <div id="rank-panel">
        <h2>Ränge</h2>
        <div id="ranks"></div>
        <div id="rank-form" style="display:none;">
          <input id="rank-name" placeholder="Name" />
          <input id="rank-order" placeholder="Order (Zahl)" />
          <input id="rank-pay" placeholder="Gehalt" />
          <button id="rank-save">Speichern</button>
        </div>
      </div>
      <button id="closeBtn">Schließen</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
